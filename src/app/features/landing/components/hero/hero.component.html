<section class="hero">
  <div class="hero__bg" [ngStyle]="bgStyle">
    <div class="hero__overlay"></div>
  </div>

  <div class="hero__content">
    <h1 class="hero__title">
      <img
        class="hero__logo"
        src="/assets/images/Logos-01.png"
        alt="Vibra Music Studio"
      />
    </h1>
    <p class="hero__subtitle">
      Crear, compartir y crecer
    </p>
    <button class="hero__cta" (click)="onExplore()">
      Explorar
      <span class="hero__cta-arrow">→</span>
    </button>
  </div>

  <button class="hero__scroll" (click)="onExplore()">
    <span class="hero__scroll-label">Scroll</span>
    <span class="hero__scroll-icon">⌄</span>
  </button>
</section>
