<section id="contact" class="contact">
  <div class="contact__inner">
    <p class="contact__eyebrow">Estamos aquí para ti</p>
    <h2 class="contact__title">Contacto</h2>

    <div class="contact__grid">
      <div class="contact__info">
        <div *ngFor="let item of contactInfo" class="contact__info-item">
          <span class="contact__info-icon">
            <img [src]="item.icon" alt="" class="contact__info-icon-img" />
          </span>
          <ng-container [ngSwitch]="item.icon">
            <a
              *ngSwitchCase="'/assets/images/iconos/ubi.png'"
              href="https://maps.app.goo.gl/7QpTr7k4yJPqqDLG7"
              target="_blank"
              rel="noopener"
              class="contact__info-value"
            >
              {{ item.value }}
            </a>
            <a
              *ngSwitchCase="'/assets/images/iconos/redesrojas-25.png'"
              href="tel:{{ item.value }}"
              class="contact__info-value"
            >
              {{ item.value }}
            </a>
            <a
              *ngSwitchCase="'/assets/images/iconos/correo.png'"
              href="mailto:{{ item.value }}"
              class="contact__info-value"
            >
              {{ item.value }}
            </a>
            <p
              *ngSwitchDefault
              class="contact__info-value"
              style="white-space: pre-line"
            >
              {{ item.value }}
            </p>
          </ng-container>
        </div>
        <div class="contact__social">
          <a
            href="https://wa.me/34665239177"
            target="_blank"
            rel="noopener"
            class="contact__social-btn"
            aria-label="WhatsApp"
          >
            <img src="/assets/images/iconos/redesrojas-25.png" alt="" class="contact__social-icon" />
          </a>
          <a
            href="https://www.tiktok.com/@vibra.music.studi?_r=1&_t=ZN-9AgmAaB2pF8"
            target="_blank"
            rel="noopener"
            class="contact__social-btn"
            aria-label="TikTok"
          >
            <img src="/assets/images/iconos/redesrojas-26.png" alt="" class="contact__social-icon" />
          </a>
          <a
            href="https://www.instagram.com/vibramusicstudio?xtok=cDh3eTRxcHd2cHFt&utm_source=qr"
            target="_blank"
            rel="noopener"
            class="contact__social-btn"
            aria-label="Instagram"
          >
            <img src="/assets/images/iconos/redesrojas-27.png" alt="" class="contact__social-icon" />
          </a>
        </div>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="contact__form">
        <div class="contact__field">
          <label class="contact__label" for="contact-name">Nombre completo</label>
          <input
            id="contact-name"
            type="text"
            formControlName="name"
            class="contact__input"
            [class.contact__input--error]="hasError('name')"
          />
          <p *ngIf="hasError('name')" class="contact__error">Introduce tu nombre.</p>
        </div>

        <div class="contact__field">
          <label class="contact__label" for="contact-email">Email</label>
          <input
            id="contact-email"
            type="email"
            formControlName="email"
            class="contact__input"
            [class.contact__input--error]="hasError('email')"
          />
          <p *ngIf="hasError('email')" class="contact__error">Introduce un email válido.</p>
        </div>

        <div class="contact__field">
          <label class="contact__label" for="contact-msg">Mensaje</label>
          <textarea
            id="contact-msg"
            rows="4"
            formControlName="message"
            class="contact__input contact__input--textarea"
            [class.contact__input--error]="hasError('message')"
          ></textarea>
          <p *ngIf="hasError('message')" class="contact__error">Escribe tu mensaje.</p>
        </div>

        <div *ngIf="sent()" class="contact__sent">
          <span class="contact__sent-icon">✓</span>
          ¡Mensaje enviado! Te contactamos pronto.
        </div>

        <button *ngIf="!sent()" type="submit" class="contact__submit" [disabled]="sending()">
          {{ sending() ? 'Enviando…' : 'Enviar mensaje →' }}
        </button>
      </form>
    </div>
  </div>
</section>
