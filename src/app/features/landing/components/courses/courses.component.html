<section id="courses" class="courses">
  <div class="courses__inner">
    <p class="courses__eyebrow">Aprende con los mejores profesores</p>
    <h2 class="courses__title">Cursos</h2>

    <div class="courses__filters">
      <div class="courses__filter-group" role="group" aria-labelledby="category-filter-label">
        <p id="category-filter-label" class="courses__filter-label">Categoría</p>
        <div class="courses__filter-chips">
          <button
            type="button"
            class="courses__chip"
            [class.courses__chip--active]="categoryFilter() === 'all'"
            [attr.aria-pressed]="categoryFilter() === 'all'"
            (click)="setCategory('all')"
          >
            Todos
          </button>
          <button
            *ngFor="let category of categories"
            type="button"
            class="courses__chip"
            [class.courses__chip--active]="categoryFilter() === category"
            [attr.aria-pressed]="categoryFilter() === category"
            (click)="setCategory(category)"
          >
            <img
              class="courses__chip-logo"
              [src]="filterLogos[category]"
              alt=""
              aria-hidden="true"
            />
            <span>{{ categoryName(category) }}</span>
          </button>
        </div>
      </div>

      <div class="courses__filter-group" role="group" aria-labelledby="modality-filter-label">
        <p id="modality-filter-label" class="courses__filter-label">Modalidad</p>
        <div class="courses__filter-chips">
          <button
            type="button"
            class="courses__chip"
            [class.courses__chip--active]="modalityFilter() === 'all'"
            [attr.aria-pressed]="modalityFilter() === 'all'"
            (click)="setModality('all')"
          >
            Todos
          </button>
          <button
            *ngFor="let modality of modalities"
            type="button"
            class="courses__chip"
            [class.courses__chip--active]="modalityFilter() === modality"
            [attr.aria-pressed]="modalityFilter() === modality"
            (click)="setModality(modality)"
          >
            <img
              class="courses__chip-logo"
              [src]="modalityIcons[modality]"
              alt=""
              aria-hidden="true"
            />
            <span>{{ modalityName(modality) }}</span>
          </button>
        </div>
      </div>
    </div>

    <p *ngIf="!hasAnyResults()" class="courses__empty">No hay cursos con el filtro seleccionado.</p>

    <div *ngIf="hasAnyResults()" class="courses__list">
      <div *ngFor="let group of filteredGroups" class="course-group">
        <button
          type="button"
          class="course-group__header"
          [attr.aria-expanded]="isCategoryExpanded(group.category)"
          [attr.aria-controls]="'group-body-' + group.category"
          (click)="toggleCategory(group.category)"
        >
          <img class="course-group__logo" [src]="group.logo" alt="" aria-hidden="true" />
          <div class="course-group__info">
            <h3 class="course-group__name">{{ group.name }}</h3>
            <div class="course-group__meta">
              <span
                >{{ group.courses.length }} modalidad{{
                  group.courses.length > 1 ? 'es' : ''
                }}</span
              >
            </div>
          </div>
          <span
            class="course-group__chevron"
            [class.course-group__chevron--open]="isCategoryExpanded(group.category)"
            aria-hidden="true"
          >
            ⌄
          </span>
        </button>

        <div
          *ngIf="isCategoryExpanded(group.category)"
          [id]="'group-body-' + group.category"
          class="course-group__body"
          role="region"
        >
          <div *ngFor="let course of group.courses" class="course-row">
            <div class="course-row__left">
              <img
                class="course-row__modality-icon"
                [src]="modalityIcons[course.modality]"
                alt=""
                aria-hidden="true"
              />
              <div class="course-row__modality-info">
                <span class="course-row__modality-name">{{ modalityName(course.modality) }}</span>
                <span class="course-row__duration">{{ modalityDuration(course.modality) }}</span>
              </div>
            </div>
            <span class="course-row__price">
              {{ course.price }}€/{{ priceUnitName(course.priceUnit) }}
            </span>
            <button type="button" class="course-row__reserve" (click)="reserve(course)">
              Reservar <span aria-hidden="true">→</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
