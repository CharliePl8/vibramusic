<section id="courses" class="courses">
  <div class="courses__inner">
    <p class="courses__eyebrow">Aprende con los mejores profesores</p>
    <h2 class="courses__title">Cursos</h2>

    <div class="courses__filters">
      <div class="courses__filter-group" role="group" aria-labelledby="category-filter-label">
        <p id="category-filter-label" class="courses__filter-label">Categoría</p>
        <div class="courses__filter-chips">
          <button
            type="button"
            class="courses__chip"
            [class.courses__chip--active]="categoryFilter() === 'all'"
            [attr.aria-pressed]="categoryFilter() === 'all'"
            (click)="setCategory('all')"
          >
            Todos
          </button>
          <button
            *ngFor="let category of categories"
            type="button"
            class="courses__chip"
            [class.courses__chip--active]="categoryFilter() === category"
            [attr.aria-pressed]="categoryFilter() === category"
            (click)="setCategory(category)"
          >
            <img
              class="courses__chip-logo"
              [src]="filterLogos[category]"
              alt=""
              aria-hidden="true"
            />
            <span>{{ categoryName(category) }}</span>
          </button>
        </div>
      </div>

      <div class="courses__filter-group" role="group" aria-labelledby="modality-filter-label">
        <p id="modality-filter-label" class="courses__filter-label">Modalidad</p>
        <div class="courses__filter-chips">
          <button
            type="button"
            class="courses__chip"
            [class.courses__chip--active]="modalityFilter() === 'all'"
            [attr.aria-pressed]="modalityFilter() === 'all'"
            (click)="setModality('all')"
          >
            Todos
          </button>
          <button
            *ngFor="let modality of modalities"
            type="button"
            class="courses__chip"
            [class.courses__chip--active]="modalityFilter() === modality"
            [attr.aria-pressed]="modalityFilter() === modality"
            (click)="setModality(modality)"
          >
            <img
              class="courses__chip-logo"
              [src]="modalityIcons[modality]"
              alt=""
              aria-hidden="true"
            />
            <span>{{ modalityName(modality) }}</span>
          </button>
        </div>
      </div>
    </div>

    <p *ngIf="filteredCourses.length === 0" class="courses__empty">
      No hay cursos con el filtro seleccionado.
    </p>

    <div *ngIf="filteredCourses.length > 0" class="courses__list">
      <div *ngFor="let course of filteredCourses" class="course-card">
        <button
          type="button"
          class="course-card__header"
          [attr.aria-expanded]="expandedCourse() === course.id"
          [attr.aria-controls]="'course-body-' + course.id"
          (click)="toggleCourse(course.id)"
        >
          <img
            class="course-card__logo"
            [src]="courseLogos[course.category]"
            alt=""
            aria-hidden="true"
          />
          <div class="course-card__info">
            <h3 [id]="'course-title-' + course.id" class="course-card__name">
              {{ course.name }}
            </h3>
            <div class="course-card__meta">
              <span>{{ course.teacher }}</span>
              <span>{{ course.level }}</span>
              <span class="course-card__price">{{ course.price }}€/mes</span>
              <span>
                <img
                  class="course-card__modality-icon"
                  [src]="modalityIcons[course.modality]"
                  alt=""
                  aria-hidden="true"
                />
                {{ modalityName(course.modality) }}
              </span>
            </div>
          </div>
          <span
            class="course-card__chevron"
            [class.course-card__chevron--open]="expandedCourse() === course.id"
            aria-hidden="true"
          >
            ⌄
          </span>
        </button>
        <div
          *ngIf="expandedCourse() === course.id"
          [id]="'course-body-' + course.id"
          class="course-card__body"
          role="region"
          [attr.aria-labelledby]="'course-title-' + course.id"
        >
          <p class="course-card__desc">{{ course.description }}</p>
          <div class="course-card__actions">
            <button type="button" class="course-card__reserve" (click)="reserve(course)">
              Reservar <span aria-hidden="true">→</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
