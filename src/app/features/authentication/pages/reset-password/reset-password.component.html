<div class="auth">
  <div class="auth__card">
    <ng-container *ngIf="!ready(); else checking">
      <p class="auth__eyebrow">Comprobando el enlace…</p>
    </ng-container>

    <ng-template #checking>
      <ng-container *ngIf="invalid(); else formCard">
        <p class="auth__eyebrow">Ups</p>
        <h1 class="auth__title">Enlace no válido</h1>
        <p class="auth__confirm">
          El enlace de recuperación no es válido o ha caducado. Solicita uno nuevo.
        </p>
        <a routerLink="/recuperar" class="auth__submit">Solicitar otro enlace</a>
      </ng-container>

      <ng-template #formCard>
        <p class="auth__eyebrow">Crear nueva contraseña</p>
        <h1 class="auth__title">Restablecer contraseña</h1>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth__form">
          <div class="auth__field">
            <label class="auth__label" for="reset-password">Nueva contraseña</label>
            <input
              id="reset-password"
              type="password"
              formControlName="password"
              class="auth__input"
              [class.auth__input--error]="hasError('password')"
            />
            <p *ngIf="hasError('password')" class="auth__error">
              Mínimo 6 caracteres.
            </p>
          </div>

          <div class="auth__field">
            <label class="auth__label" for="reset-confirm">Repite la contraseña</label>
            <input
              id="reset-confirm"
              type="password"
              formControlName="confirm"
              class="auth__input"
              [class.auth__input--error]="hasError('confirm')"
            />
            <p *ngIf="hasError('confirm')" class="auth__error">Repite tu contraseña.</p>
          </div>

          <p *ngIf="errorMsg()" class="auth__error auth__error--server">{{ errorMsg() }}</p>

          <button type="submit" class="auth__submit" [disabled]="loading()">
            {{ loading() ? 'Guardando…' : 'Guardar nueva contraseña' }}
          </button>
        </form>

        <p class="auth__alt">
          <a routerLink="/login" class="auth__link">Volver a iniciar sesión</a>
        </p>
      </ng-template>
    </ng-template>
  </div>
</div>
