<div class="auth">
  <div class="auth__card">
    <ng-container *ngIf="!sent(); else confirm">
      <p class="auth__eyebrow">¿Se te ha olvidado?</p>
      <h1 class="auth__title">Recuperar contraseña</h1>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth__form">
        <div class="auth__field">
          <label class="auth__label" for="forgot-email">Tu email</label>
          <input
            id="forgot-email"
            type="email"
            formControlName="email"
            class="auth__input"
            [class.auth__input--error]="hasError()"
          />
          <p *ngIf="hasError()" class="auth__error">Introduce un email válido.</p>
        </div>

        <p *ngIf="errorMsg()" class="auth__error auth__error--server">{{ errorMsg() }}</p>

        <button type="submit" class="auth__submit" [disabled]="loading()">
          {{ loading() ? 'Enviando…' : 'Enviar enlace de recuperación' }}
        </button>
      </form>

      <p class="auth__alt">
        ¿Recuerdas tu contraseña?
        <a routerLink="/login" class="auth__link">Inicia sesión</a>
      </p>
    </ng-container>

    <ng-template #confirm>
      <p class="auth__eyebrow">Revisa tu correo</p>
      <h1 class="auth__title">Enlace enviado</h1>
      <p class="auth__confirm">
        Te hemos enviado un enlace a
        <strong>{{ form.value.email }}</strong
        >. Ábrelo para crear una nueva contraseña.
      </p>
      <a routerLink="/login" class="auth__submit">Volver al inicio de sesión</a>
    </ng-template>
  </div>
</div>
