<div class="toast-container" aria-live="polite" aria-atomic="false">
  <div *ngFor="let toast of toasts()" class="toast toast--{{ toast.type }}" role="status">
    <span class="toast__icon" aria-hidden="true">{{ icon(toast.type) }}</span>
    <p class="toast__message">{{ toast.message }}</p>
    <button class="toast__close" (click)="dismiss(toast.id)" aria-label="Cerrar notificación">
      ✕
    </button>
  </div>
</div>
